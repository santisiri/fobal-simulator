# CI — the merge gate. Everything here runs CREDENTIAL-LESS: tests,
# typechecks, the client build's rewrite assertions, and both CDK synth
# paths (bare synth = the deploy-neutral rule; full contexts = the gated
# resources). Anything that touches AWS lives in deploy.yml behind OIDC.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # characterization (golden parity) first, then the vitest suites —
      # same order as local `npm test`
      - run: npm test
      - name: client build — every golden rewrite must assert exactly once
        run: |
          node tools/build-client.mjs \
            --lobby-url https://lobby-staging.fobal.ai \
            --match-ws  wss://matches-staging.fobal.ai

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: synth with no contexts — merges must stay deploy-neutral
        run: npm run cdk -- synth --all --quiet
      - name: synth with every context gate open
        run: |
          npm run cdk -- synth --all --quiet \
            -c certificateArn=arn:aws:acm:sa-east-1:368426158592:certificate/00000000-0000-0000-0000-000000000000 \
            -c wildcardCertificateArn=arn:aws:acm:sa-east-1:368426158592:certificate/00000000-0000-0000-0000-000000000000 \
            -c prodCertificateArn=arn:aws:acm:sa-east-1:368426158592:certificate/00000000-0000-0000-0000-000000000000 \
            -c prodWildcardCertificateArn=arn:aws:acm:sa-east-1:368426158592:certificate/00000000-0000-0000-0000-000000000000 \
            -c aiSecrets=1 \
            -c imageTag=ci

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the generated art is a CROSS-LANGUAGE CONTRACT: the browser preview,
      # the Solidity decoder and these fixtures must all be the same bytes.
      # Regenerating and diffing is what stops them drifting apart.
      - name: art codegen is current (gates + round-trip run inside)
        run: |
          node packages/art/tools/gen-art.mjs
          node packages/art/tools/atlas-doc.mjs
          # EVERY generated artefact, including the browser module — it is
          # emitted by gen-art.mjs and was previously outside this diff, so a
          # hand edit to it would have survived CI.
          git diff --exit-code -- \
            packages/art/gen \
            contracts/src/art/FobalArtConstants.sol \
            apps/web/public/js/avatar.js \
            docs/ART_ATLAS_V2.md \
            || { echo "::error::generated art is stale — run node packages/art/tools/gen-art.mjs && node packages/art/tools/atlas-doc.mjs and commit"; exit 1; }
      # colour is what flatters a weak silhouette. This strips it and measures
      # every pair of hair, headwear and beard masks; gen-art gates on the same
      # library, this step surfaces WHICH pair collided.
      - name: silhouette separation
        run: node packages/art/tools/silhouette.mjs
      - name: install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge deps
        working-directory: contracts
        run: |
          forge install --no-git foundry-rs/forge-std@v1.16.2
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.4.0
      # EIP-170 must be gated on build --sizes: `forge test` silently relaxes
      # the limit and will happily run bytecode mainnet would reject.
      - name: build + EIP-170 margin gate
        working-directory: contracts
        run: |
          forge build --sizes | tee /tmp/sizes.txt
          # column 5 is the RUNTIME margin; anchoring on '^| Fobal' avoids
          # matching source lines that merely mention a contract name
          awk -F'|' '/^\| *Fobal/ && NF>=6 {
              name=$2; gsub(/^ +| +$/,"",name);
              m=$5;    gsub(/[ ,]/,"",m);
              if (m+0 < 2048) { print "::error::" name " runtime margin " m "B < 2048B"; bad=1 }
            } END { exit bad+0 }' /tmp/sizes.txt
      - name: forge test
        working-directory: contracts
        run: forge test -vv
