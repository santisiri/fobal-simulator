<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FOBAL lobby — find an opponent, coach by voice, keep the rivalry.">
<meta name="theme-color" content="#070b12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<title>FOBAL — Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --sans: "Space Grotesk", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; min-height: 100%; background: #070b12; color: #e8eef5;
    font-family: var(--mono); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid rgba(70,200,150,0.25); }
  header h1 { font-family: var(--sans); font-weight: 800; font-size: 15px; margin: 0;
    letter-spacing: 3px; }
  header h1 span { color: #2be08f; }
  header .who { margin-left: auto; font-size: 12px; opacity: 0.8; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  .card { background: rgba(12,19,32,0.9); border: 1px solid rgba(70,200,150,0.3);
    border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-family: var(--sans); margin: 0 0 12px; font-size: 12px;
    letter-spacing: 2.5px; color: #2be08f; }
  button, input { background: #0c1320; color: #e8eef5; border: 1px solid rgba(70,200,150,0.4);
    border-radius: 6px; padding: 8px 12px; font: inherit; }
  button { cursor: pointer; font-family: var(--sans); font-weight: 600; letter-spacing: 0.5px; }
  button:hover { border-color: #2be08f; }
  button.danger { border-color: rgba(226,89,72,0.5); }
  button.primary { background: #123726; border-color: #2be08f; font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .player { display: flex; gap: 10px; align-items: center; padding: 8px 4px;
    border-bottom: 1px solid rgba(70,200,150,0.12); }
  .player:last-child { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; flex: none; }
  .dot.on { background: #2be08f; box-shadow: 0 0 6px #2be08f; }
  .player .name { flex: 1; }
  .player .team { opacity: 0.65; font-size: 12px; }
  .tag { font-size: 10px; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px;
    border: 1px solid rgba(232,238,245,0.3); opacity: 0.8; }
  .rec { font-size: 11px; opacity: 0.6; letter-spacing: 1px; }
  .badge { font-weight: 700; width: 20px; height: 20px; border-radius: 4px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .badge.W { background: #123726; color: #2be08f; }
  .badge.D { background: #1c2430; color: #9fb2c8; }
  .badge.L { background: #3a1420; color: #ffb0a8; }
  .badge.live { background: #0c1320; color: #e8eef5; font-size: 9px; width: auto; padding: 0 6px; }
  .squadRow { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .squadRow .rl { width: 30px; opacity: 0.55; font-size: 11px; flex: none; }
  .squadRow input.pname { flex: 1; padding: 4px 8px; min-width: 0; }
  input[type=color] { padding: 0; width: 34px; height: 26px; cursor: pointer; }
  .muted { opacity: 0.6; font-size: 12px; }
  .err { color: #ffb0a8; font-size: 12px; min-height: 16px; }
  #matchCard { border-color: #2be08f; box-shadow: 0 0 24px rgba(43,224,143,0.15); }
  #matchCard .big { font-size: 18px; font-weight: 700; letter-spacing: 1px; margin: 4px 0 12px; }
  .hidden { display: none; }
  @media (max-width: 480px) {
    header { padding: 8px 10px; }
    header h1 { font-size: 12px; letter-spacing: 1px; }
    header .who { font-size: 10px; }
    main { padding: 14px 8px; }
    .card { padding: 12px 10px; margin-bottom: 12px; }
    button, input { padding: 6px 9px; font-size: 12px; }
    .player { flex-wrap: wrap; row-gap: 4px; }
    .player .team { font-size: 11px; }
    #matchCard .big { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <h1>FOBAL<span>.ai</span> LOBBY</h1>
  <span class="who" id="who"></span>
  <button id="logoutBtn" class="hidden">LOG OUT</button>
</header>
<main>
  <!-- login -->
  <section id="loginView" class="hidden">
    <div class="card">
      <h2>SIGN IN</h2>
      <div class="row">
        <input id="lobbyUrl" size="28" placeholder="lobby url" value="http://localhost:8475">
      </div>
      <div class="row">
        <input id="email" type="email" size="28" placeholder="you@example.com" autocomplete="email">
        <button id="requestBtn" class="primary">SEND CODE</button>
      </div>
      <div class="row hidden" id="codeRow">
        <input id="code" size="12" placeholder="login code" autocomplete="one-time-code">
        <button id="verifyBtn" class="primary">ENTER LOBBY</button>
      </div>
      <div class="err" id="loginErr"></div>
      <div class="muted" id="loginNote"></div>
    </div>
  </section>

  <!-- lobby -->
  <section id="lobbyView" class="hidden">
    <div class="card hidden" id="matchCard">
      <h2>MATCH READY</h2>
      <div class="big" id="matchLine"></div>
      <div class="row">
        <button id="enterBtn" class="primary">ENTER MATCH</button>
        <button id="specBtn">COPY SPECTATOR LINK</button>
        <button id="leaveBtn" class="danger">LEAVE</button>
      </div>
      <div class="muted" id="enterNote"></div>
    </div>

    <div class="card">
      <h2>MY TEAM</h2>
      <div class="row">
        <span id="teamName" style="font-weight:700; letter-spacing:1px;"></span>
        <button id="renameBtn" title="rename team">✎</button>
        <button id="squadBtn">EDIT SQUAD</button>
      </div>
      <div id="squadPanel" class="hidden">
        <div class="row" style="margin-top:10px;">
          <span class="muted">KIT</span>
          <input type="color" id="kitPrimary" value="#d8342c" title="primary — shirt and socks">
          <input type="color" id="kitSecondary" value="#f2ece0" title="secondary — shorts and trim">
          <span class="muted">shirt · shorts</span>
        </div>
        <div id="squadList" style="margin:8px 0;"></div>
        <div class="row">
          <button id="squadSave" class="primary">SAVE SQUAD</button>
          <button id="squadClose">CLOSE</button>
          <span class="muted" id="squadNote"></span>
        </div>
      </div>
    </div>

    <div class="card" id="challengesCard">
      <h2>CHALLENGES</h2>
      <div id="challenges"><span class="muted">none pending</span></div>
    </div>

    <div class="card">
      <h2>PLAYERS ONLINE</h2>
      <div id="players"><span class="muted">nobody else is here yet</span></div>
    </div>

    <div class="card">
      <h2>MATCH HISTORY</h2>
      <div id="history"><span class="muted">no matches yet — challenge someone</span></div>
    </div>
    <div class="err" id="lobbyErr"></div>
  </section>
</main>

<script type="module">
  const $ = id => document.getElementById(id);
  const SESSION_KEY = 'fobal.lobby.session';
  // team names are free text typed by OTHER players — never let them into
  // innerHTML unescaped
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // sessionStorage on purpose: it is per-tab, so two tabs are two players
  // (essential for local testing; hosted persistence can revisit this)
  let session = null;   // { url, token }
  try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch {}
  const params = new URLSearchParams(location.search);
  if (params.get('lobby')) $('lobbyUrl').value = params.get('lobby');
  else if (session?.url) $('lobbyUrl').value = session.url;
  else if (window.FOBAL_CONFIG?.lobbyUrl) $('lobbyUrl').value = window.FOBAL_CONFIG.lobbyUrl;

  const api = async (path, { method = 'GET', body } = {}) => {
    const res = await fetch(`${session.url}${path}`, {
      method,
      headers: { 'content-type': 'application/json', authorization: `Bearer ${session.token}` },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (res.status === 401 && path === '/lobby'){ logout(); throw new Error('session expired'); }
    return res;
  };

  function show(view){
    $('loginView').classList.toggle('hidden', view !== 'login');
    $('lobbyView').classList.toggle('hidden', view !== 'lobby');
    $('logoutBtn').classList.toggle('hidden', view !== 'lobby');
  }

  function logout(){
    sessionStorage.removeItem(SESSION_KEY);
    session = null;
    clearInterval(pollTimer);
    $('who').textContent = '';
    show('login');
  }
  $('logoutBtn').onclick = logout;

  // ---- login flow -------------------------------------------------------
  $('requestBtn').onclick = async () => {
    $('loginErr').textContent = '';
    const url = $('lobbyUrl').value.replace(/\/+$/, '');
    try {
      const res = await fetch(`${url}/auth/request`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: $('email').value.trim() }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error ?? res.status);
      $('codeRow').classList.remove('hidden');
      if (out.devCode){
        $('code').value = out.devCode;
        $('loginNote').textContent = 'dev mode: code auto-filled';
      } else {
        $('loginNote').textContent = 'check your email for the code';
      }
    } catch (err){ $('loginErr').textContent = String(err.message ?? err); }
  };

  $('verifyBtn').onclick = async () => {
    $('loginErr').textContent = '';
    const url = $('lobbyUrl').value.replace(/\/+$/, '');
    try {
      const res = await fetch(`${url}/auth/verify`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: $('email').value.trim(), code: $('code').value.trim() }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error ?? res.status);
      session = { url, token: out.token };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      enterLobby();
    } catch (err){ $('loginErr').textContent = String(err.message ?? err); }
  };

  // ---- lobby ------------------------------------------------------------
  let pollTimer = null;
  let enteredMatchId = sessionStorage.getItem('fobal.lobby.entered');

  function matchClientUrl(match, token){
    const ws = match.matchUrl.replace(/^http/, 'ws');
    return `index.html?ws=${encodeURIComponent(ws)}&match=${encodeURIComponent(match.matchId)}&token=${encodeURIComponent(token)}`;
  }

  const rec = r => r ? `<span class="rec">${r.w}W ${r.d}D ${r.l}L</span>` : '';

  function render(state){
    $('who').textContent = `${state.me.handle} · ${state.me.teamName}`;
    $('teamName').innerHTML = `${esc(state.me.teamName)} &nbsp;${rec(state.me.record)}`;

    const players = state.players
      .sort((a, b) => (b.online - a.online) || a.handle.localeCompare(b.handle))
      .map(p => `
        <div class="player">
          <span class="dot ${p.online ? 'on' : ''}"></span>
          <span class="name">${esc(p.handle)} ${rec(p.record)}</span>
          <span class="team">${esc(p.teamName)}</span>
          ${p.inMatch ? '<span class="tag">IN MATCH</span>'
            : p.online ? `<button data-challenge="${p.accountId}">CHALLENGE</button>` : ''}
        </div>`).join('');
    $('players').innerHTML = players || '<span class="muted">nobody else is here yet</span>';

    const rows = [
      ...state.challenges.incoming.map(c => `
        <div class="player">
          <span class="name">⚔ ${esc(c.from.handle)} (${esc(c.from.teamName)}) ${c.rematch ? 'wants a REMATCH' : 'challenges you'}</span>
          <button class="primary" data-accept="${c.id}">ACCEPT</button>
          <button class="danger" data-decline="${c.id}">DECLINE</button>
        </div>`),
      ...state.challenges.outgoing.map(c => `
        <div class="player">
          <span class="name">→ waiting for ${esc(c.to.handle)}…</span>
          <button class="danger" data-decline="${c.id}">CANCEL</button>
        </div>`),
    ].join('');
    $('challenges').innerHTML = rows || '<span class="muted">none pending</span>';

    const match = state.match;
    $('matchCard').classList.toggle('hidden', !match);
    if (match){
      $('matchLine').textContent = `${state.me.teamName} · match ${match.matchId}`;
      $('enterBtn').onclick = () => {
        sessionStorage.setItem('fobal.lobby.entered', match.matchId);
        location.href = matchClientUrl(match, match.token);
      };
      $('specBtn').onclick = async () => {
        const link = new URL(matchClientUrl(match, match.spectatorToken), location.href).href;
        try { await navigator.clipboard.writeText(link); $('enterNote').textContent = 'spectator link copied'; }
        catch { prompt('spectator link:', link); }
      };
      $('leaveBtn').onclick = async () => {
        await api(`/matches/${match.matchId}/leave`, { method: 'POST', body: {} });
        sessionStorage.removeItem('fobal.lobby.entered');
        enteredMatchId = null;
        poll();
      };
      // fresh match (not one we already entered and came back from): auto-enter
      if (enteredMatchId !== match.matchId){
        $('enterNote').textContent = 'entering in 3s…';
        clearTimeout(render.autoEnter);
        render.autoEnter = setTimeout(() => {
          sessionStorage.setItem('fobal.lobby.entered', match.matchId);
          location.href = matchClientUrl(match, match.token);
        }, 3000);
      } else {
        $('enterNote').textContent = 'you can re-enter or share the spectator link';
      }
    } else {
      clearTimeout(render.autoEnter);
    }
  }

  document.addEventListener('click', async (e) => {
    const el = e.target;
    try {
      let action = null;
      if (el.dataset?.challenge) action = await api('/challenges', { method: 'POST', body: { to: el.dataset.challenge } });
      else if (el.dataset?.rematch) action = await api('/challenges', { method: 'POST', body: { to: el.dataset.rematch, rematchOf: el.dataset.rematchOf } });
      else if (el.dataset?.accept) action = await api(`/challenges/${el.dataset.accept}/accept`, { method: 'POST', body: {} });
      else if (el.dataset?.decline) action = await api(`/challenges/${el.dataset.decline}/decline`, { method: 'POST', body: {} });
      else return;
      if (!action.ok){
        const out = await action.json().catch(() => ({}));
        $('lobbyErr').textContent = out.error ?? `request failed (${action.status})`;
        errHoldUntil = Date.now() + 6000;   // outlive the poll's auto-clear
      } else {
        $('lobbyErr').textContent = '';
      }
      const res = await api('/lobby');
      if (res.ok) render(await res.json());
    } catch (err){ $('lobbyErr').textContent = String(err.message ?? err); }
  });

  // ---- squad editor (M1: names + kit; ratings are not editable) ---------
  let squadDefaults = {};
  $('squadBtn').onclick = async () => {
    const panel = $('squadPanel');
    if (!panel.classList.contains('hidden')){ panel.classList.add('hidden'); return; }
    const res = await api('/squad');
    if (!res.ok) return;
    const squad = await res.json();
    squadDefaults = Object.fromEntries(squad.players.map(p => [p.playerId, p.defaultName]));
    if (squad.colors?.primary) $('kitPrimary').value = squad.colors.primary;
    if (squad.colors?.secondary) $('kitSecondary').value = squad.colors.secondary;
    $('squadList').innerHTML = squad.players.map(p => `
      <div class="squadRow">
        <span class="rl">#${p.shirtNumber}</span><span class="rl">${esc(p.role)}</span>
        <input class="pname" data-pid="${p.playerId}" value="${esc(p.name)}" maxlength="24">
        <button data-preset="${p.playerId}" title="reset to default">↺</button>
      </div>`).join('');
    for (const btn of document.querySelectorAll('[data-preset]'))
      btn.onclick = () => {
        const input = document.querySelector(`.pname[data-pid="${btn.dataset.preset}"]`);
        input.value = squadDefaults[btn.dataset.preset] ?? input.value;
      };
    $('squadNote').textContent = '';
    panel.classList.remove('hidden');
  };
  $('squadClose').onclick = () => $('squadPanel').classList.add('hidden');
  $('squadSave').onclick = async () => {
    const players = [...document.querySelectorAll('#squadList .pname')]
      .map(el => ({ playerId: el.dataset.pid, name: el.value }));
    const res = await api('/squad', { method: 'POST', body: {
      colors: { primary: $('kitPrimary').value, secondary: $('kitSecondary').value },
      players,
    } });
    const out = await res.json().catch(() => ({}));
    $('squadNote').textContent = res.ok ? 'saved — your next match wears it' : (out.error ?? 'save failed');
  };

  $('renameBtn').onclick = async () => {
    const name = prompt('team name (2–32 chars):');
    if (!name) return;
    const res = await api('/account/team', { method: 'POST', body: { teamName: name } });
    const out = await res.json();
    if (!res.ok) $('lobbyErr').textContent = out.error;
    else poll();
  };

  const ago = iso => {
    const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
    return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.round(m / 60)}h ago`;
  };

  function renderHistory(history){
    const rows = history.matches.map(m => `
      <div class="player">
        ${m.outcome ? `<span class="badge ${m.outcome}">${m.outcome}</span>` : '<span class="badge live">LIVE</span>'}
        <span class="name">${m.score ? `<b>${m.score[0]} - ${m.score[1]}</b>` : '· - ·'}
          vs ${m.opponent ? `${esc(m.opponent.handle)} (${esc(m.opponent.teamName)})` : '?'}</span>
        <span class="team">${ago(m.finishedAt ?? m.createdAt)}</span>
        ${m.outcome ? `<button data-watch="${m.matchId}" data-watch-url="${esc(m.matchUrl)}" data-watch-token="${esc(m.spectatorToken)}">WATCH</button>` : ''}
        ${m.outcome && m.opponent ? `<button data-rematch="${m.opponent.accountId}" data-rematch-of="${m.matchId}">REMATCH</button>` : ''}
      </div>`).join('');
    $('history').innerHTML = rows || '<span class="muted">no matches yet — challenge someone</span>';
    for (const btn of document.querySelectorAll('[data-watch]'))
      btn.onclick = () => {
        location.href = `index.html?replayUrl=${encodeURIComponent(btn.dataset.watchUrl)}`
          + `&match=${encodeURIComponent(btn.dataset.watch)}&token=${encodeURIComponent(btn.dataset.watchToken)}`;
      };
  }

  async function fetchHistory(){
    try {
      const res = await api('/history');
      if (res.ok) renderHistory(await res.json());
    } catch { /* next cycle */ }
  }

  let pollCount = 0;
  let wasInMatch = false;
  let errHoldUntil = 0;
  async function poll(){
    try {
      const res = await api('/lobby');
      if (!res.ok) return;
      if (Date.now() > errHoldUntil) $('lobbyErr').textContent = '';
      const state = await res.json();
      render(state);
      // refresh history on a slow cadence, and IMMEDIATELY when my match
      // just ended (full time detected server-side) so the result pops in
      const ended = wasInMatch && !state.match;
      wasInMatch = !!state.match;
      if (ended || pollCount++ % 5 === 0) await fetchHistory();
    } catch (err){
      if (session) $('lobbyErr').textContent = `lobby unreachable: ${err.message ?? err}`;
    }
  }

  function enterLobby(){
    show('lobby');
    poll();
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 2000);
  }

  if (session?.token) enterLobby();
  else show('login');
</script>
</body>
</html>
