<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="fobal.ai — live football between two managers. Your players are yours, on-chain; your tactics are spoken out loud.">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<title>FOBAL — Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- ui.css = the shared design system (byte-identical to fobal.css's
     shared block, proven by tokens.test) PLUS the product atoms the app's
     views reuse (player cards, the detail drawer, skeletons). -->
<link rel="stylesheet" href="../../match-client/src/ui/ui.css">
<style>
  /* ==== the unified shell — tokens come from fobal.css, never redefined ==== */
  /* the hidden attribute must beat any display: the shell toggles with it */
  [hidden] { display: none !important; }

  .shell { min-height: 100vh; display: flex; flex-direction: column; }

  .shellbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--hairline); box-shadow: var(--toplight); }
  .shellbar .brand { display: inline-flex; align-items: center; }
  .shellbar .brand:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--green-hi); border-radius: 6px; }
  .shellbar-spacer { flex: 1; }
  .shellbar .who-chip i { color: var(--ink-faint); font-style: normal; margin: 0 2px; }
  .shellbar .ens { color: var(--purple-hi); font-family: var(--font-data); }
  .who-skel { width: 90px; display: inline-block; }
  .btn-sm { padding: 8px 14px; font-size: 11px; }

  .shellbody { flex: 1; display: flex; align-items: stretch; max-width: 1280px; width: 100%;
    margin: 0 auto; padding: 20px; gap: 20px; }

  /* nav rail — icons with names, active in green */
  .shellnav { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .shellnav-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 72px; padding: 11px 6px 9px; border-radius: var(--r-m);
    background: linear-gradient(180deg, rgba(17,26,51,0.7), rgba(13,20,40,0.7));
    border: 1px solid var(--hairline); box-shadow: var(--toplight);
    transition: transform 0.12s ease, border-color 0.12s ease; }
  .shellnav-item span { font-size: 20px; line-height: 1; }
  .shellnav-item b { font-family: var(--font-data); font-weight: 500; font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
  .shellnav-item:hover { transform: translateY(-1px); border-color: var(--hairline-2); }
  .shellnav-item:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--green-hi); }
  .shellnav-item.active { border-color: rgba(34,197,94,0.45); box-shadow: var(--toplight), 0 0 18px rgba(34,197,94,0.12); }
  .shellnav-item.active b { color: var(--green-hi); }

  .shellmain { flex: 1; min-width: 0; outline: none; }
  .view-enter { animation: view-rise 0.22s ease-out; }
  @keyframes view-rise { from { opacity: 0; transform: translateY(8px); } }

  /* ==== the entry ==== */
  .entry-bezel { margin-top: 6px; }
  .entry { display: grid; grid-template-columns: 1.15fr 0.85fr; min-height: 520px; }
  .entry-hero { padding: 48px 44px; display: flex; flex-direction: column; position: relative; }
  .entry-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(640px 260px at 14% -10%, rgba(248,250,252,0.1), transparent 70%); }
  .entry-hero > * { position: relative; z-index: 1; }
  .entry-brandline { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .entry-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(180deg, var(--green-hi), var(--green-lo)); color: var(--bg);
    font-size: 15px; box-shadow: 0 4px 16px rgba(34,197,94,0.4), inset 0 1px 0 rgba(255,255,255,0.4); }
  .entry-name { font-family: var(--font-display); font-weight: 800; letter-spacing: 1.5px; font-size: 16px; }
  .entry-name span { color: var(--green-hi); }
  .entry-kick { font-size: clamp(40px, 6vw, 64px); text-transform: uppercase; margin: 8px 0 0; }
  .entry-kick span { color: var(--green-hi); text-shadow: 0 0 34px rgba(34,197,94,0.35); }
  .entry-sub { color: var(--ink-dim); font-size: 16px; line-height: 1.55; max-width: 480px; margin: 18px 0 0; }
  .entry-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .btn-lg { padding: 15px 26px; font-size: 13px; }
  .entry-words { display: flex; gap: 10px; align-items: center; margin-top: auto; padding-top: 34px; }
  .entry-words i { color: var(--ink-faint); font-style: normal; }
  .entry-words .purple { color: var(--purple-hi); }
  .entry-words .green { color: var(--green-hi); }
  .entry-door { border-left: 1px solid var(--hairline); padding: 44px 34px;
    display: flex; flex-direction: column; gap: 16px; justify-content: center;
    background: linear-gradient(180deg, rgba(13,20,40,0.55), rgba(5,7,15,0.35)); }

  /* ==== sign in — the equal door ==== */
  .signin { display: flex; flex-direction: column; gap: 14px; }
  .signin > .label { margin-bottom: 2px; }
  .signin-email { display: flex; flex-direction: column; gap: 10px; padding: 14px;
    border-radius: var(--r-m); background: rgba(5,7,15,0.5); border: 1px solid var(--hairline); }
  .signin-row { display: flex; gap: 8px; }
  .signin-row .input { flex: 1; min-width: 0; }
  .signin-code { display: flex; flex-direction: column; gap: 8px; animation: view-rise 0.15s ease-out; }
  .signin-divider { display: flex; align-items: center; gap: 12px; }
  .signin-divider::before, .signin-divider::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .signin-divider span { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ink-faint); }
  .signin-wallet { flex-direction: column; gap: 4px; padding: 14px 22px; }
  .signin-wallet small { font-family: var(--font-body); font-weight: 400; font-size: 11px;
    text-transform: none; letter-spacing: 0; opacity: 0.8; }
  .signin-err { color: var(--red); font-size: 13px; margin: 0; min-height: 18px; }
  .signin-note { color: var(--ink-dim); font-size: 13px; margin: 0; }
  .signin--compact .signin-email { padding: 12px; }

  .doorcard { display: flex; align-items: center; gap: 12px; padding: 14px;
    border-radius: var(--r-m); border: 1px dashed var(--hairline-2);
    transition: border-color 0.12s ease, transform 0.12s ease; }
  .doorcard:hover { border-color: rgba(34,197,94,0.5); transform: translateY(-1px); }
  .doorcard:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--green-hi); }
  .doorcard-ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; flex: none;
    background: linear-gradient(180deg, var(--green-hi), var(--green-lo)); color: var(--bg); font-size: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
  .doorcard-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .doorcard-body b { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .doorcard-body small { color: var(--ink-dim); font-size: 12px; }
  .doorcard-go { color: var(--green-hi); font-size: 15px; }

  /* ==== the club home ==== */
  .club { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  .club-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .club-rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .clubhead { display: flex; align-items: center; gap: 20px; padding: 22px; position: relative; }
  .clubhead::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(600px 220px at 12% -30%, rgba(248,250,252,0.12), transparent 70%); }
  .clubhead > * { position: relative; z-index: 1; }
  .clubhead-who { flex: 1; min-width: 0; }
  .clubhead-who h1 { font-size: clamp(24px, 3.4vw, 34px); margin-top: 2px; overflow-wrap: anywhere; }
  .clubhead-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .crest { position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px;
    border-radius: 8px; overflow: hidden; border: 1px solid var(--hairline-2); flex: none; }
  .crest i { position: absolute; inset: 0; }
  .crest b { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 800;
    font-size: 12px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  .crest--hero { width: 92px; height: 92px; border-radius: 16px; }
  .crest--hero b { font-size: 32px; }

  .statrow { display: flex; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 18px;
    border-left: 1px solid var(--hairline); }
  .stat:first-child { border-left: 0; }
  .stat .v { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
  .stat .v.green { color: var(--green-hi); }
  .stat .l { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.14em; color: var(--ink-faint); }

  .kickoff { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .kickoff--live { border-color: rgba(34,197,94,0.5); box-shadow: var(--toplight), 0 0 30px rgba(34,197,94,0.14); }
  .kickoff-line { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .kickoff-line b { color: var(--green-hi); }
  .kickoff-cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .kickoff-note { margin: 0; font-size: 12px; min-height: 15px; }

  .squadpanel { padding: 18px 20px; }
  .squadpanel-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .squadpanel-head h2 { font-size: 16px; letter-spacing: 0.4px; flex: 1; }
  .strip { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; }
  .strip-p { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
  .strip-p .avatar-disc { width: 100%; }
  .strip-p svg { width: 100%; max-width: 52px; border-radius: 8px; border: 1.5px solid var(--hairline-2);
    transition: transform 0.12s ease, border-color 0.12s ease; }
  .strip-p:hover svg { transform: translateY(-3px); border-color: var(--green-hi); }
  .strip-nm { font-family: var(--font-data); font-size: 9px; letter-spacing: 0.3px; color: var(--ink-dim);
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip-ov { font-family: var(--font-display); font-weight: 800; font-size: 12px; color: var(--green-hi); }
  .strip-tile { display: grid; place-items: center; width: 100%; max-width: 52px; aspect-ratio: 1;
    border-radius: 8px; border: 1.5px solid var(--hairline-2); font-family: var(--font-display);
    font-weight: 800; font-size: 16px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.45);
    background: linear-gradient(90deg, var(--k1, #22c55e) 0 34%, var(--k2, #0d1428) 34% 66%, var(--k1, #22c55e) 66% 100%); }
  .strip-tile.gk { background: repeating-linear-gradient(45deg, var(--k2, #0d1428) 0 6px, var(--k1, #22c55e) 6px 12px); }
  .strip-skel { width: 100%; max-width: 52px; aspect-ratio: 1; height: auto; border-radius: 8px; }
  .squadpanel-note { font-size: 12px; margin: 12px 0 0; }

  .needs { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .needs h2 { margin: 0 0 2px; }
  .need { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px;
    border-radius: var(--r-s); border: 1px solid var(--hairline); background: rgba(5,7,15,0.35); }
  .need-copy { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; color: var(--ink-dim); }
  .need-copy b { color: var(--ink); }
  .need-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none;
    background: rgba(248,250,252,0.25); }
  .need-dot--green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .need-dot--own { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
  .need-dot--warn { background: var(--gold); box-shadow: 0 0 8px rgba(245,196,81,0.6); }
  .need--link { transition: border-color 0.12s ease; }
  .need--link:hover { border-color: var(--hairline-2); }
  .need--link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--green-hi); }
  .need-go { color: var(--green-hi); }
  .need--settled { border-color: rgba(168,85,247,0.45); box-shadow: 0 0 22px rgba(168,85,247,0.14);
    flex-direction: column; align-items: stretch; gap: 8px; }
  .need--settled .need-copy b { color: var(--purple-hi); }
  .need-pips { display: flex; justify-content: center; }

  .lastft { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .lastft-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lastft-score { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
  .lastft-ago { margin-left: auto; }
  .lastft-watch { align-self: flex-start; }
  .badge { font-family: var(--font-data); font-weight: 600; width: 22px; height: 22px; border-radius: 5px;
    flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .badge--W { background: rgba(34,197,94,0.16); color: var(--green-hi); }
  .badge--D { background: rgba(120,150,200,0.16); color: var(--ink-dim); }
  .badge--L { background: rgba(248,113,113,0.14); color: var(--red); }

  /* ==== onboarding ==== */
  .onb .rail { display: flex; margin: 4px 0 28px; }
  .rail-step { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .rail-bar { height: 3px; border-radius: 2px; background: var(--hairline-2); }
  .rail-step.done .rail-bar, .rail-step.active .rail-bar { background: var(--green); box-shadow: 0 0 10px rgba(34,197,94,0.4); }
  .rail-n { font-family: var(--font-data); font-size: 11px; letter-spacing: 2px; color: var(--ink-faint); }
  .rail-step.active .rail-n, .rail-step.done .rail-n { color: var(--green-hi); }
  .rail-t { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.5px; color: var(--ink-dim); }
  .rail-step.active .rail-t { color: var(--ink); }

  .stepview { display: none; }
  .stepview.on { display: block; animation: view-rise 0.3s ease-out; }

  .onb-create { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; align-items: start; }
  .onb-create h1 { font-size: clamp(30px, 4.4vw, 40px); margin: 4px 0 6px; }
  .field-row { margin: 18px 0; display: flex; flex-direction: column; gap: 8px; }
  .kits { display: flex; gap: 18px; flex-wrap: wrap; }
  .kitpick { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .swatchrow { display: flex; align-items: center; gap: 10px; }
  .crestcard { padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .crestbig { width: 132px; height: 132px; border-radius: 16px; display: grid; place-items: center;
    position: relative; overflow: hidden; border: 1px solid var(--hairline-2); margin-top: 6px; }
  .crestbig-stripe { position: absolute; inset: 0; opacity: 0.9; }
  .crestbig span { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 800;
    font-size: 46px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  .crestcard-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.5px; }

  .onb-generate { text-align: center; padding: 48px 0; }
  .onb-generate h1 { font-size: clamp(26px, 4vw, 34px); margin: 6px 0 10px; }
  .onb-generate p { max-width: 560px; margin: 0 auto; }
  .scan { max-width: 460px; margin: 26px auto 0; }
  .scan-track { height: 8px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--hairline-2); overflow: hidden; }
  .scan-track i { display: block; height: 100%; width: 0; background: var(--green); box-shadow: 0 0 14px var(--green); transition: width 0.1s linear; }
  .scan-log { margin-top: 14px; min-height: 22px; font-size: 12px; letter-spacing: 1px; color: var(--ink-dim); }

  .onb-meet h1 { font-size: clamp(26px, 4vw, 34px); margin: 4px 0 0; }
  .onb-meet-sub { margin: 6px 0 22px; }
  /* obreveal, not reveal — ui.css owns .reveal for the card entrance */
  .obreveal { display: grid; grid-template-columns: 1fr 320px; gap: 22px; align-items: start; }
  .pitchwrap { perspective: 1000px; }
  .obpitch { position: relative; width: 100%; padding-top: 66%; border-radius: 14px; overflow: hidden;
    transform: rotateX(36deg); transform-origin: center 54%;
    background: repeating-linear-gradient(0deg, #14401f 0 8.33%, #123a1c 8.33% 16.66%), var(--grass);
    border: 1px solid rgba(120, 200, 150, 0.25); box-shadow: 0 40px 80px rgba(0,0,0,0.55); }
  .obpitch-lines { position: absolute; inset: 5%; border: 2px solid rgba(255,255,255,0.16); border-radius: 4px; }
  .obpitch-lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(255,255,255,0.16); }
  .obpitch-lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; padding-top: 22%;
    transform: translate(-50%,-50%); border: 2px solid rgba(255,255,255,0.16); border-radius: 50%; }
  .obpitch-box { position: absolute; left: 28%; width: 44%; height: 15%; border: 2px solid rgba(255,255,255,0.14); }
  .obpitch-box.top { top: 0; border-top: 0; }
  .obpitch-box.bottom { bottom: 0; border-bottom: 0; }
  .obtoken { position: absolute; transform: translate(-50%, -50%) rotateX(-38deg); width: 44px; cursor: pointer; text-align: center; }
  .obtoken svg { width: 36px; height: 36px; display: block; margin: 0 auto; image-rendering: pixelated;
    border-radius: 7px; border: 1.5px solid rgba(0,0,0,0.35); filter: drop-shadow(0 6px 6px rgba(0,0,0,0.5)); transition: transform 0.12s; }
  .obtoken:hover svg, .obtoken.sel svg { transform: scale(1.14); border-color: var(--green); }
  .obtoken:focus-visible { outline: none; }
  .obtoken:focus-visible svg { border-color: var(--green-hi); box-shadow: 0 0 0 3px rgba(34,197,94,0.4); }
  .obtoken-nm { margin-top: 3px; font-family: var(--font-data); font-size: 9px; letter-spacing: 0.5px; color: #fff;
    background: rgba(7,11,22,0.7); border-radius: 4px; padding: 1px 4px; display: inline-block; white-space: nowrap; }

  /* obcard, not pcard — ui.css owns .pcard for the on-pitch player chip */
  .obcard { padding: 0; overflow: hidden; position: sticky; top: 16px; }
  .pcard-kitbar { height: 6px; }
  .pcard-top { display: flex; gap: 12px; padding: 16px 16px 6px; align-items: center; }
  .pcard-av { width: 60px; height: 60px; border-radius: 10px; border: 1px solid var(--hairline-2); flex: none; }
  .pcard-nm { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.1; }
  .pcard-meta { font-size: 11px; letter-spacing: 1px; color: var(--ink-dim); margin-top: 3px; }
  .pcard-ovr { margin-left: auto; text-align: center; }
  .pcard-ovr .v { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--green-hi); line-height: 1; }
  .pcard-ovr .l { font-family: var(--font-data); font-size: 9px; letter-spacing: 2px; color: var(--ink-faint); }
  .pcard-ratings { padding: 8px 16px 14px; display: grid; gap: 7px; }
  .pcard-dna { border-top: 1px solid var(--hairline); padding: 11px 16px; font-size: 10px; color: var(--ink-faint);
    letter-spacing: 0.5px; word-break: break-all; }
  .pcard-hint { padding: 20px 16px; text-align: center; }
  .footer-cta { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; align-items: center; }

  .notfound { max-width: 460px; margin: 60px auto; padding: 34px; text-align: center;
    display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .notfound h1 { font-size: 26px; }

  /* ==== the squad room (J2 — absorbed from squad.html) ==== */
  .hidden { display: none !important; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 0 0 6px; }
  .room-shell { display: flex; flex-direction: column; gap: 14px; }
  .roomcard { padding: 16px; }
  .roomcard > .label { display: block; margin-bottom: 12px; }
  .room { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 14px; }
  .room-hint { font-size: 13px; margin: 10px 0 0; }
  .room-skel { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 20px; }
  .room-skel .skeleton { height: 12px; }
  .room-skel .skeleton:nth-child(2) { width: 70%; }
  .room-skel .skeleton:nth-child(3) { width: 45%; }

  .roomgate { max-width: 520px; margin: 40px auto; }
  .roomgate-card { padding: 30px; display: flex; flex-direction: column; gap: 12px; }
  .roomgate-card h1 { font-size: clamp(24px, 3.6vw, 32px); }

  .formbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .btn-quiet.on { border-color: rgba(34,197,94,0.55); color: var(--green-hi);
    box-shadow: inset 0 1px 0 rgba(248,250,252,0.08), 0 0 14px rgba(34,197,94,0.15); }

  .roompitch { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 10px;
    border: 1px solid var(--hairline-2);
    background:
      linear-gradient(0deg, rgba(34,197,94,0.07), rgba(34,197,94,0.02)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.028) 0 8%, transparent 8% 16%),
      var(--bg-2);
    overflow: hidden; }
  .roompitch::before, .roompitch::after { content: ""; position: absolute; left: 22%; right: 22%;
    height: 13%; border: 1px solid rgba(255,255,255,0.12); }
  .roompitch::before { top: -1px; border-top: 0; }
  .roompitch::after { bottom: -1px; border-bottom: 0; }
  .roompitch .halfway { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgba(255,255,255,0.12); }
  .roompitch .centre { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1;
    transform: translate(-50%,-50%); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; }

  .slot { position: absolute; transform: translate(-50%, 50%); width: 74px; text-align: center; }
  .slot .pcard { width: 100%; padding: 6px 2px 5px; }
  .slot .slotLabel { font-family: var(--font-data); font-size: 9px; letter-spacing: 1.4px;
    color: var(--ink-faint); margin-top: 3px; }
  .slot.target .pcard { border-color: var(--green); box-shadow: 0 0 0 2px rgba(34,197,94,0.35); }
  .slot.oop .slotLabel { color: var(--gold); }
  .slot-empty { opacity: 0.55; min-height: 92px; justify-content: center;
    font-family: var(--font-data); letter-spacing: 1.4px; font-size: 11px; color: var(--ink-dim);
    border: 1px dashed var(--hairline-2) !important; }

  .listrow { display: flex; align-items: center; gap: 10px; padding: 8px 6px; width: 100%;
    text-align: left; background: none; border: 0; border-bottom: 1px solid var(--hairline);
    border-radius: 0; color: var(--ink); font-family: var(--font-body); font-size: 14px;
    font-weight: 500; cursor: pointer; }
  .listrow:hover { background: rgba(255,255,255,0.03); }
  .listrow:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--green-hi); }
  .listrow:last-child { border-bottom: 0; }
  .listrow.sel { background: rgba(34,197,94,0.1); box-shadow: inset 2px 0 0 var(--green); }
  .listrow .n { font-family: var(--font-data); font-size: 11px; color: var(--ink-faint); width: 22px; }
  .listrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .listrow .rl { font-family: var(--font-data); font-size: 10px; letter-spacing: 1px; color: var(--ink-dim); }
  .listrow .ov { font-family: var(--font-data); font-weight: 700; font-size: 12px; }
  .sublabel { display: block; margin: 12px 0 4px; }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 14px; }
  .choices { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; }
  .choice { display: flex; flex-direction: column; gap: 6px; }
  .choice .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 16px; margin-top: 14px; }
  .grp h3 { font-family: var(--font-data); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--green-hi); margin: 0 0 10px; font-weight: 600; }
  .fld { margin-bottom: 12px; }
  .fld .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .fld .ends { display: flex; justify-content: space-between; font-family: var(--font-data);
    font-size: 9px; color: var(--ink-faint); letter-spacing: 0.5px; }
  .fld input[type=range] { width: 100%; accent-color: var(--green); margin: 0; }
  .fld input[type=range]:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--green-hi); border-radius: 4px; }
  .fld .val { font-family: var(--font-data); color: var(--ink-dim); font-size: 11px; }

  .savebar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: var(--r-m); border: 1px solid var(--hairline-2);
    background: rgba(7,11,22,0.92); backdrop-filter: blur(8px); box-shadow: 0 -10px 30px rgba(0,0,0,0.35); }
  .savebar-status { flex: 1; font-size: 13px; color: var(--ink-dim); }
  .savebar-status.ok { color: var(--green-hi); }
  .savebar-status.bad { color: var(--red); }

  /* the player-detail drawer ships its own controls (it mounts at body
     level) — give its plain buttons/inputs the app's voice */
  .drawer button { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.7px;
    padding: 8px 12px; border-radius: 9px; border: 1px solid var(--hairline-2);
    background: var(--panel); color: var(--ink); cursor: pointer; }
  .drawer button:hover { border-color: var(--green); }
  .drawer button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--green-hi); }
  .drawer button.primary { background: linear-gradient(180deg, var(--green-hi), var(--green-lo));
    color: var(--bg); border: 0; }
  .drawer button.ghost { background: transparent; }
  .drawer input { padding: 9px 12px; border-radius: 9px; background: rgba(5,7,15,0.6);
    border: 1px solid var(--hairline-2); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
  .drawer input:focus { outline: none; border-color: var(--green-hi); }

  /* ==== responsive ==== */
  @media (max-width: 980px) {
    .club { grid-template-columns: 1fr; }
    .entry { grid-template-columns: 1fr; }
    .entry-door { border-left: 0; border-top: 1px solid var(--hairline); }
    .obreveal, .onb-create { grid-template-columns: 1fr; }
    .room { grid-template-columns: 1fr; }
    .slot { width: 62px; }
    .obcard { position: static; }
  }
  @media (max-width: 760px) {
    .shellbody { flex-direction: column; padding: 14px 12px 60px; gap: 14px; }
    .shellnav { flex-direction: row; overflow-x: auto; padding-bottom: 2px; }
    .shellnav-item { width: auto; min-width: 64px; flex: 1; padding: 9px 8px 7px; }
    .clubhead { flex-wrap: wrap; }
    .statrow { width: 100%; justify-content: flex-start; }
    .strip { grid-template-columns: repeat(6, 1fr); }
    .entry-hero { padding: 30px 22px; }
    .entry-door { padding: 26px 22px; }
    .shellbar { padding: 10px 12px; gap: 8px; }
    .shellbar-season { display: none; }
  }
  @media (max-width: 440px) {
    .strip { grid-template-columns: repeat(4, 1fr); }
    .signin-row { flex-direction: column; }
  }
  @media (max-width: 560px) {
    .savebar { flex-wrap: wrap; }
    .savebar-status { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .view-enter, .stepview.on, .signin-code { animation: none; }
    .shellnav-item, .doorcard, .need--link, .strip-p svg { transition: none; }
  }
</style>

  createApp({
